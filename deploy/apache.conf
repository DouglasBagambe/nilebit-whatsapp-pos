<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    # Render terminates public HTTPS before forwarding to this container.
    # Do not trust client-supplied forwarding headers to determine the scheme.
    SetEnv HTTPS on
    ErrorLog /proc/self/fd/2
    # One-use account-link tokens are in URL paths; never include paths or referrers.
    LogFormat "%h %t %m %>s %b" privacy
    CustomLog /proc/self/fd/1 privacy
</VirtualHost>
