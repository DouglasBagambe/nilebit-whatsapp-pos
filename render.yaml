# Free Render web service with persistent external Neon Postgres.
services:
- type: web
  name: nilebit-whatsapp-pos
  runtime: docker
  region: frankfurt
  plan: free
  repo: https://github.com/DouglasBagambe/nilebit-whatsapp-pos
  branch: feature/whatsapp-foundations
  autoDeployTrigger: 'off'
  healthCheckPath: /up
  dockerCommand: bash deploy/start.sh combined
  envVars:
  - key: APP_NAME
    value: NileBit POS WhatsApp
  - key: APP_ENV
    value: production
  - key: APP_DEBUG
    value: 'false'
  - key: LOG_CHANNEL
    value: stderr
  - key: LOG_LEVEL
    value: warning
  - key: DB_CONNECTION
    value: pgsql
  - key: QUEUE_CONNECTION
    value: database
  - key: DB_QUEUE_RETRY_AFTER
    value: '120'
  - key: CACHE_STORE
    value: database
  - key: SESSION_DRIVER
    value: database
  - key: SESSION_ENCRYPT
    value: 'true'
  - key: SESSION_SECURE_COOKIE
    value: 'true'
  - key: WHATSAPP_ON_DEMAND_WORKER
    value: 'true'
  - key: WHATSAPP_ENABLED
    value: 'false'
  - key: WHATSAPP_API_VERSION
    value: v25.0
  - key: WHATSAPP_PHONE_NUMBER_ID
    value: '1364950226710147'
  - key: DB_URL
    sync: false
  - key: APP_KEY_BASE64
    generateValue: true
  - key: WHATSAPP_VERIFY_TOKEN
    generateValue: true
  - key: WHATSAPP_APP_SECRET
    sync: false
  - key: WHATSAPP_ACCESS_TOKEN
    sync: false
  - key: RETAIL_API_URL
    sync: false
  - key: PRODUCTION_API_URL
    sync: false
  maxShutdownDelaySeconds: 90
